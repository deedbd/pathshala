name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  PNPM_VERSION: 12.3.4
  NODE_VERSION: 22

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: pathshala }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=3s --health-retries=20
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: root, POSTGRES_DB: pathshala }
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "${{ env.PNPM_VERSION }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schema + seeds are up to date with db/schema/*.def.mjs and docs
        run: |
          pnpm db:generate
          git diff --exit-code -- db packages/db/src/schema || (echo "::error::run 'pnpm db:generate' and commit" && exit 1)
      - run: pnpm build
      - run: pnpm typecheck
      - name: No native packages in the server's production tree
        run: pnpm check:native apps/server
      - name: Smoke test — SQLite (node:sqlite fallback)
        run: bash scripts/ci-smoke.sh sqlite
      - name: Smoke test — MySQL 8 (cPanel primary)
        if: ${{ !cancelled() }}
        run: bash scripts/ci-smoke.sh mysql
        env: { TEST_DB_URL: 'mysql://root:root@127.0.0.1:3306/pathshala' }
      - name: Smoke test — Postgres 16 (VPS/Docker)
        if: ${{ !cancelled() }}
        run: bash scripts/ci-smoke.sh postgres
        env: { TEST_DB_URL: 'postgres://postgres:root@127.0.0.1:5432/pathshala' }
      - name: Build cPanel release zip (Linux x64, Node 22, node_modules baked in)
        run: pnpm release:cpanel
      - run: pnpm check:native release/app
      - uses: actions/upload-artifact@v4
        with:
          name: pathshala-cpanel
          path: release/*.zip
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (same commit as the cPanel zip)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pathshala:${{ github.sha }}
      - name: Boot with Postgres via docker compose and hit /_health
        run: |
          echo "PATHSHALA_IMAGE=pathshala:${{ github.sha }}" > .env.compose
          docker compose --env-file .env.compose up -d db
          sleep 8
          docker compose --env-file .env.compose up -d app
          for i in $(seq 1 30); do curl -sf http://localhost:3000/_health && break; sleep 2; done
          curl -sf http://localhost:3000/_health | tee health.json
          grep -q '"engine":"postgres"' health.json
          docker compose --env-file .env.compose down -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-test, docker]
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: pathshala-cpanel, path: release }
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
