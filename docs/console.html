<meta charset="utf-8">
<title>Pathshala Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#EAEEF2; --surface-3:#DFE5EB; --ink:#17202A; --muted:#5F6C79; --line:#D4DBE2;
    --accent:#2B5FA8; --accent-soft:#E1EAF7; --accent-ink:#1E4A87;
    --auto:#147D6F; --auto-soft:#DCEFEB; --cron:#8A5A1E; --cron-soft:#F4E8D6;
    --ok:#1E7F4F; --ok-soft:#DDF2E6; --warn:#A8651A; --warn-soft:#F7E9D2; --bad:#B9352F; --bad-soft:#F8E0DE; --info:#2B5FA8; --info-soft:#E1EAF7;
    --shadow:0 1px 2px rgba(23,32,42,.06),0 6px 20px rgba(23,32,42,.07);
    --display:"Bricolage Grotesque","Segoe UI",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
    --sb:236px; --tb:54px; color-scheme:light;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0E1418; --surface:#161D24; --surface-2:#1F2831; --surface-3:#28333E; --ink:#E5EAEF; --muted:#97A4B1; --line:#2B3641;
    --accent:#86B4F2; --accent-soft:#1B2C44; --accent-ink:#B7D2F7; --auto:#4FC4B0; --auto-soft:#143430; --cron:#E0AE68; --cron-soft:#3A2C16;
    --ok:#4FC786; --ok-soft:#143A26; --warn:#E3A85A; --warn-soft:#3A2A12; --bad:#EF7C74; --bad-soft:#42201D; --info:#86B4F2; --info-soft:#1B2C44;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark; } }
  :root[data-theme="dark"]{
    --bg:#0E1418; --surface:#161D24; --surface-2:#1F2831; --surface-3:#28333E; --ink:#E5EAEF; --muted:#97A4B1; --line:#2B3641;
    --accent:#86B4F2; --accent-soft:#1B2C44; --accent-ink:#B7D2F7; --auto:#4FC4B0; --auto-soft:#143430; --cron:#E0AE68; --cron-soft:#3A2C16;
    --ok:#4FC786; --ok-soft:#143A26; --warn:#E3A85A; --warn-soft:#3A2A12; --bad:#EF7C74; --bad-soft:#42201D; --info:#86B4F2; --info-soft:#1B2C44;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark; }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;overflow:hidden}
  a{color:var(--accent)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;outline:none;min-width:0}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
  h1{font-size:1.55rem;font-weight:700;letter-spacing:-.01em}
  h2{font-size:1.15rem;font-weight:700}
  h3{font-size:1rem;font-weight:700}
  .mono{font-family:var(--mono);font-size:.85em}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .small{font-size:.82rem}
  .eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:var(--sb) 1fr;grid-template-rows:var(--tb) 1fr;height:100vh}
  .topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.05rem;width:calc(var(--sb) - 16px)}
  .brand .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.8rem;font-family:var(--mono)}
  .brand .demo{font-family:var(--mono);font-size:.62rem;padding:2px 6px;border-radius:3px;background:var(--cron-soft);color:var(--cron);font-weight:500}
  .search{position:relative;flex:1;max-width:480px}
  .search input{width:100%;padding-left:34px;background:var(--surface-2);border-color:transparent}
  .search svg{position:absolute;left:11px;top:9px;width:16px;height:16px;color:var(--muted)}
  .search .results{position:absolute;top:40px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:20}
  .search .results div{padding:8px 12px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;border-bottom:1px solid var(--line)}
  .search .results div:hover{background:var(--surface-2)}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;white-space:nowrap}
  .pill select{border:0;padding:0;background:transparent;font-size:.8rem}
  .iconbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;position:relative;color:var(--muted)}
  .iconbtn:hover{background:var(--surface-2);color:var(--ink)}
  .iconbtn svg{width:18px;height:18px}
  .iconbtn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;font-weight:500}
  .popover{position:absolute;top:46px;right:0;width:360px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:20;overflow:hidden}
  .popover .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:600}
  .popover .it{padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem;display:grid;gap:2px;cursor:pointer}
  .popover .it:hover{background:var(--surface-2)}

  .sidebar{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px 40px}
  .sidebar .grp{margin:12px 8px 4px;font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:.88rem;width:100%;text-align:left}
  .nav-item:hover{background:var(--surface-2)}
  .nav-item.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .nav-item .mg{width:24px;height:24px;border-radius:6px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font-family:var(--mono);font-size:.62rem;font-weight:500;flex:none}
  .nav-item.on .mg{background:var(--accent);color:#fff}
  .nav-item .cnt{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
  .sub{margin:2px 0 6px 22px;border-left:1px solid var(--line);display:grid}
  .sub a{display:block;padding:5px 12px;font-size:.82rem;color:var(--muted);text-decoration:none;border-left:2px solid transparent;margin-left:-1px}
  .sub a:hover{color:var(--ink)}
  .sub a.on{color:var(--accent-ink);border-left-color:var(--accent);font-weight:600}

  .main{overflow-y:auto;padding:22px 26px 60px;scroll-behavior:smooth}
  .crumbs{font-size:.8rem;color:var(--muted);display:flex;gap:6px;margin-bottom:6px}
  .crumbs a{color:var(--muted);text-decoration:none}
  .crumbs a:hover{color:var(--ink)}
  .page-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .page-hd p{margin:4px 0 0;color:var(--muted);max-width:70ch}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;font-weight:500;white-space:nowrap}
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-ink)}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
  .btn.sm{padding:4px 9px;font-size:.78rem}
  .btn.ghost{border-color:transparent}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  .grid{display:grid;gap:16px}
  .cols-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
  .cols-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .cols-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
  .card.pad0{padding:0;overflow:hidden}
  .card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card .hd h3{font-size:.95rem}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;cursor:pointer;text-align:left}
  .kpi:hover{border-color:var(--accent)}
  .kpi .lbl{font-size:.78rem;color:var(--muted)}
  .kpi .val{font-family:var(--display);font-size:1.7rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi .sub{font-size:.76rem;color:var(--muted);display:flex;gap:6px;align-items:center;margin:0;border:0}
  .kpi .sub b{font-weight:600}
  .up{color:var(--ok)} .down{color:var(--bad)}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap;font-family:var(--body)}
  .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.mute{background:var(--surface-2);color:var(--muted)} .chip.auto{background:var(--auto-soft);color:var(--auto)} .chip.cron{background:var(--cron-soft);color:var(--cron)}
  .tag{display:inline-block;font-family:var(--mono);font-size:.7rem;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted)}

  /* table */
  .tbl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
  .tbl-tools input[type=search]{min-width:220px}
  .fchips{display:flex;gap:6px;flex-wrap:wrap}
  .fchip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.78rem;background:var(--surface)}
  .fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tbl-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.86rem}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
  th{font-family:var(--mono);font-weight:500;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
  th .s{opacity:.5;margin-left:4px}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr.click{cursor:pointer}
  tr:last-child td{border-bottom:0}
  td.r,th.r{text-align:right}
  .tbl-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
  .pg{display:flex;gap:4px}
  .pg button{padding:3px 8px;border-radius:5px;border:1px solid var(--line)}
  .pg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .rowlink{color:var(--accent);text-decoration:none;font-weight:500}
  .rowlink:hover{text-decoration:underline}

  /* tabs */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
  .tabs button{padding:9px 14px;font-size:.86rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}

  /* drawer / modal / toast */
  .overlay{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:30;display:none}
  .overlay.show{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,96vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:31;transform:translateX(102%);transition:transform .2s;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  .drawer.show{transform:none}
  .drawer .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .drawer .db{padding:18px;overflow-y:auto;display:grid;gap:16px;align-content:start}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:32;display:none}
  .modal.show{display:block}
  .modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .mb{padding:18px;display:grid;gap:12px}
  .modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .field{display:grid;gap:4px}
  .field label{font-size:.78rem;color:var(--muted);font-weight:500}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:40}
  .toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:.84rem;box-shadow:var(--shadow);max-width:380px;display:grid;gap:2px;animation:up .2s}
  .toast .t2{font-size:.76rem;opacity:.8}
  @keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.toast{animation:none}.drawer{transition:none}}

  /* misc components */
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:.86rem}
  .kv dt{color:var(--muted)} .kv dd{margin:0}
  .feed{display:grid;gap:0}
  .feed .fi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.84rem;align-items:start}
  .feed .fi:last-child{border-bottom:0}
  .feed .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:.62rem;font-weight:600}
  .feed .ic.sys{background:var(--accent-soft);color:var(--accent-ink)} .feed .ic.rule{background:var(--auto-soft);color:var(--auto)} .feed .ic.cron{background:var(--cron-soft);color:var(--cron)} .feed .ic.bad{background:var(--bad-soft);color:var(--bad)}
  .feed time{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
  .switch{width:36px;height:20px;border-radius:999px;background:var(--surface-3);position:relative;flex:none}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
  .switch.on{background:var(--ok)} .switch.on::after{left:18px}
  .bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
  .chart svg{width:100%;height:auto;display:block}
  .chart text{fill:var(--muted);font-size:10px;font-family:var(--mono)}
  .chart .grid line{stroke:var(--line)}
  .list{display:grid}
  .list .li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem;align-items:center}
  .list .li:last-child{border-bottom:0}
  .tt{display:grid;grid-template-columns:70px repeat(6,1fr);gap:4px;font-size:.76rem}
  .tt .c{background:var(--surface-2);border-radius:6px;padding:6px 8px;min-height:44px}
  .tt .c b{display:block;font-weight:600} .tt .c span{color:var(--muted)}
  .tt .h{font-family:var(--mono);font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
  .att-row{display:grid;grid-template-columns:50px 1fr 160px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{padding:4px 10px;font-size:.78rem;font-weight:600;color:var(--muted)}
  .seg button.P.on{background:var(--ok-soft);color:var(--ok)} .seg button.L.on{background:var(--warn-soft);color:var(--warn)} .seg button.A.on{background:var(--bad-soft);color:var(--bad)}
  .marks input{width:64px;text-align:right;padding:4px 6px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:.78rem}
  .cal .d{background:var(--surface-2);border-radius:6px;min-height:64px;padding:5px 6px;display:grid;align-content:start;gap:3px}
  .cal .d.off{opacity:.5} .cal .d.hol{background:var(--bad-soft)} .cal .d.ev{background:var(--accent-soft)}
  .cal .d small{font-size:.68rem;color:var(--muted)}
  .cal .wd{font-family:var(--mono);font-size:.64rem;text-transform:uppercase;color:var(--muted);text-align:center}
  .beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
  .bed{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:.68rem;border:1px solid var(--line);cursor:pointer}
  .bed.occ{background:var(--accent-soft);color:var(--accent-ink)} .bed.vac{background:var(--surface-2);color:var(--muted)} .bed.mnt{background:var(--warn-soft);color:var(--warn)}
  .map svg{width:100%;height:auto;display:block;background:var(--surface-2);border-radius:8px}
  .chat{display:grid;grid-template-columns:240px 1fr;min-height:460px}
  .chat .cl{border-right:1px solid var(--line)}
  .chat .ci{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.84rem;display:grid;gap:2px}
  .chat .ci.on{background:var(--accent-soft)}
  .chat .cm{display:grid;grid-template-rows:auto 1fr auto}
  .chat .msgs{padding:14px;display:grid;gap:8px;align-content:start;overflow:auto}
  .msg{max-width:70%;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:.86rem}
  .msg.me{background:var(--accent);color:#fff;justify-self:end}
  .msg time{display:block;font-size:.66rem;opacity:.7;margin-top:2px;font-family:var(--mono)}
  .phone{width:375px;height:740px;border:10px solid var(--ink);border-radius:36px;background:var(--bg);overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;margin:0 auto;box-shadow:var(--shadow)}
  .phone .ph{padding:12px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
  .phone .pb{overflow:auto;padding:14px;display:grid;gap:12px;align-content:start}
  .phone .pt{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line)}
  .phone .pt button{padding:9px 2px;font-size:.62rem;color:var(--muted);display:grid;gap:2px;justify-items:center}
  .phone .pt button.on{color:var(--accent-ink);font-weight:600}
  .phone .pt button i{width:18px;height:18px;border-radius:5px;background:var(--surface-2);display:block}
  .phone .pt button.on i{background:var(--accent)}
  .tree{font-size:.86rem;display:grid;gap:2px}
  .tree .n{display:flex;justify-content:space-between;padding:5px 8px;border-radius:5px}
  .tree .n:hover{background:var(--surface-2)}
  .tree .n.g{font-weight:600}
  .matrix td,.matrix th{text-align:center} .matrix td:first-child{text-align:left}
  .cb{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);display:inline-grid;place-items:center;cursor:pointer;background:var(--surface)}

function tabs(key, list) { const cur = ui(key, list[0][0]); return `<div class="tabs">${list.map(([v,l]) => `<button class="${cur===v?'on':''}" ${A('tab')} data-a='${J({k:key,v})}'>${esc(l)}</button>`).join('')}</div>`; }
function feedHtml(items, n=8) { return `<div class="feed">${items.slice(0,n).map(f => `<div class="fi"><span class="ic ${f.kind}">${f.kind==='sys'?'SYS':f.kind==='rule'?'RUL':f.kind==='cron'?'CRN':'ERR'}</span><span>${esc(f.text)}</span><time>${tfmt(f.at)}</time></div>`).join('')}</div>`; }
function listHtml(rows) { return `<div class="list">${rows.map(r => `<div class="li">${r}</div>`).join('')}</div>`; }
function kv(pairs) { return `<dl class="kv">${pairs.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`; }
function card(title, body, extra='') { return `<div class="card"><div class="hd"><h3>${title}</h3>${extra}</div>${body}</div>`; }

function bars(data, o={}) {
  const w = o.w || 640, h = o.h || 150, padL = 36, padB = 22, top = 10;
  const vals = data.map(d => d.v).filter(v => v != null); const max = o.max || Math.max(...vals) * 1.08, min = o.min ?? 0;
  const iw = (w - padL - 8) / data.length, bw = Math.max(4, iw * 0.62);
  const y = v => top + (h - padB - top) * (1 - (v - min) / (max - min));
  const ticks = [min, (min+max)/2, max].map(v => `<text x="${padL-6}" y="${y(v)+3}" text-anchor="end">${o.fmt ? o.fmt(v) : Math.round(v)}</text><line x1="${padL}" x2="${w-4}" y1="${y(v)}" y2="${y(v)}"/>`).join('');
  const bs = data.map((d,i) => { const x = padL + i*iw + (iw-bw)/2; const lbl = (data.length <= 14 || i % Math.ceil(data.length/12) === 0) ? `<text x="${x+bw/2}" y="${h-6}" text-anchor="middle">${esc(d.l)}</text>` : ''; if (d.v == null) return `<rect x="${x}" y="${y(min)-2}" width="${bw}" height="2" style="fill:var(--line)"/>${lbl}`; return `<rect x="${x}" y="${y(d.v)}" width="${bw}" height="${y(min)-y(d.v)}" rx="2" style="fill:${d.c || o.color || 'var(--accent)'}"><title>${esc(d.l)}: ${o.fmt ? o.fmt(d.v) : d.v}</title></rect>${lbl}`; }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label||'')}"><g class="grid">${ticks}</g>${bs}</svg></div>`;
}

/* generic table with search / sort / filter / pagination (state kept in S.tbl[id]) */
function table(id, cfg) {
  S.tbl[id] = cfg; const st = S.ui['t:'+id] || (S.ui['t:'+id] = { q:'', sort:null, dir:1, page:1, f:'all' });
  let rows = cfg.rows.slice();
  if (cfg.filterKey && st.f !== 'all') rows = rows.filter(r => String(r[cfg.filterKey]) === st.f);
  if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(r => cfg.cols.some(c => String(r[c.k] ?? '').toLowerCase().includes(q))); }
  if (st.sort) rows.sort((a,b) => { const x = a[st.sort], y = b[st.sort]; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x ?? '').localeCompare(String(y ?? ''))) * st.dir; });
  const ps = cfg.pageSize || 15, pages = Math.max(1, Math.ceil(rows.length / ps)); if (st.page > pages) st.page = pages;
  const view = rows.slice((st.page-1)*ps, st.page*ps);
  const filt = cfg.filterKey ? `<div class="fchips">${['all', ...cfg.filterOpts].map(f => `<button class="fchip ${st.f===f?'on':''}" ${A('filter')} data-a='${J({t:id,f})}'>${esc(f==='all'?'All':String(f).replace(/_/g,' '))}</button>`).join('')}</div>` : '';
  const head = cfg.cols.map(c => `<th class="${c.r?'r':''}" ${A('sort')} data-a='${J({t:id,c:c.k})}'>${esc(c.l)}${st.sort===c.k?`<span class="s">${st.dir>0?'▲':'▼'}</span>`:''}</th>`).join('');
  const body = view.length ? view.map(r => `<tr class="${cfg.onRow?'click':''}" ${cfg.onRow ? `${A(cfg.onRow.act)} data-a='${J({...cfg.onRow.a, id:r[cfg.onRow.key||'id']})}'` : ''}>${cfg.cols.map(c => `<td class="${c.r?'r num':''}">${c.fmt ? c.fmt(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cfg.cols.length}"><div class="empty">${esc(cfg.empty || 'Nothing here yet.')}</div></td></tr>`;
  const pg = pages > 1 ? `<div class="pg">${btn('‹','page',{t:id,n:st.page-1},'sm')}${Array.from({length:Math.min(pages,7)},(_,i)=>{ const n = pages<=7 ? i+1 : Math.max(1, Math.min(pages-6, st.page-3)) + i; return `<button class="${n===st.page?'on':''}" ${A('page')} data-a='${J({t:id,n})}'>${n}</button>`; }).join('')}${btn('›','page',{t:id,n:st.page+1},'sm')}</div>` : '';
  return `<div class="card pad0" id="tbl-${id}"><div class="tbl-tools">${cfg.search===false?'':`<input type="search" placeholder="${esc(cfg.placeholder||'Search…')}" value="${esc(st.q)}" data-on="search" data-t="${id}">`}${filt}<span style="margin-left:auto"></span>${cfg.tools||''}</div><div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div><div class="tbl-foot"><span>${rows.length.toLocaleString('en-IN')} ${esc(cfg.noun||'rows')}${cfg.rows.length!==rows.length?` of ${cfg.rows.length.toLocaleString('en-IN')}`:''}</span>${pg}</div></div>`;
}
function rerenderTable(id) { const el = $('#tbl-'+id); if (el && S.tbl[id]) { const q = $('input[type=search]', el); const pos = q ? q.selectionStart : null; el.outerHTML = table(id, S.tbl[id]); if (pos !== null) { const nq = $('#tbl-'+id+' input[type=search]'); if (nq) { nq.focus(); nq.setSelectionRange(pos,pos); } } } }

/* drawer / modal / toast */
function openDrawer(title, body, foot='') { $('#drawer').innerHTML = `<div class="dh"><h2>${title}</h2><div class="actions">${foot}<button class="btn sm ghost" ${A('closeDrawer')}>✕</button></div></div><div class="db">${body}</div>`; $('#drawer').classList.add('show'); $('#overlay').classList.add('show'); S.drawerOpen = true; }
function closeDrawer() { $('#drawer').classList.remove('show'); if (!$('#modal').classList.contains('show')) $('#overlay').classList.remove('show'); S.drawerOpen = false; }
function openModal(title, body, foot) { $('#modal').innerHTML = `<div class="mh"><h2>${title}</h2><button class="btn sm ghost" ${A('closeModal')}>✕</button></div><div class="mb">${body}</div><div class="mf">${foot || btn('Cancel','closeModal') }</div>`; $('#modal').classList.add('show'); $('#overlay').classList.add('show'); }
function closeModal() { $('#modal').classList.remove('show'); if (!S.drawerOpen) $('#overlay').classList.remove('show'); S.onSubmit = null; }
function toast(t1, t2) { const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<span>${esc(t1)}</span>${t2?`<span class="t2">${esc(t2)}</span>`:''}`; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 4200); }
function pushFeed(kind, text) { D.feed.unshift({ kind, text, at: new Date(TODAY.getTime() + (Date.now() % 3600000)) }); }
function field(f) { const id = 'f-'+f.k; if (f.type === 'select') return `<div class="field"><label for="${id}">${esc(f.l)}</label><select id="${id}" name="${f.k}">${f.opts.map(o => `<option ${o===f.v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`; if (f.type === 'textarea') return `<div class="field"><label for="${id}">${esc(f.l)}</label><textarea id="${id}" name="${f.k}" rows="3">${esc(f.v||'')}</textarea></div>`; return `<div class="field"><label for="${id}">${esc(f.l)}</label><input id="${id}" name="${f.k}" type="${f.type||'text'}" value="${esc(f.v ?? '')}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}></div>`; }
function formModal(title, fields, submitLabel, onSubmit) {
  const rows = []; for (let i = 0; i < fields.length; i++) { if (fields[i].half && fields[i+1] && fields[i+1].half) { rows.push(`<div class="frow">${field(fields[i])}${field(fields[i+1])}</div>`); i++; } else rows.push(field(fields[i])); }
  S.onSubmit = onSubmit; openModal(title, `<form id="mform" onsubmit="return false">${rows.join('')}</form>`, `${btn('Cancel','closeModal')}${btn(submitLabel,'submit',{}, 'primary')}`);
}
function formValues() { const o = {}; new FormData($('#mform')).forEach((v,k) => o[k] = v); return o; }

    { m:'automation', l:'Automation', mg:'AU', pages:[['rules','Rules'],['activity','Activity'],['jobs','Scheduled jobs'],['approvals','Approvals inbox'],['tasks','Tasks'],['integrations','Integrations & webhooks']] },
    { m:'settings', l:'Settings', mg:'SE', pages:[['profile','School profile'],['users','Users'],['roles','Roles & permissions'],['policies','Policies'],['sequences','Numbering'],['audit','Audit log']] },
    { m:'portals', l:'App previews', mg:'AP', pages:[['guardian','Guardian app'],['teacher','Teacher app']] } ] },
];
const ROLE_NAV = { admin:null, teacher:['home','attendance','exams','lms','academic','communication','welfare','portals'], accountant:['home','fees','accounting','hr','inventory','settings'], guardian:['portals'] };
const modOf = m => NAV.flatMap(g => g.items).find(x => x.m === m);
const COUNTS = { admissions: () => D.applications.filter(a=>a.status==='submitted').length, attendance: () => D.students.filter(s=>s.today==='absent').length, automation: () => D.approvals.filter(a=>a.status==='pending').length, frontoffice: () => D.complaints.filter(c=>c.status!=='closed'&&c.status!=='resolved').length };

function parseRoute() { const h = location.hash.replace(/^#\/?/, ''); const [path, qs] = h.split('?'); const [m='home', p='', id=''] = path.split('/'); const q = {}; (qs||'').split('&').filter(Boolean).forEach(kv => { const [k,v] = kv.split('='); q[k] = decodeURIComponent(v||''); }); return { m, p, id, q }; }
function renderSidebar(r) {
  const allow = ROLE_NAV[S.role];
  $('#sidebar').innerHTML = NAV.map(g => { const items = g.items.filter(i => !allow || allow.includes(i.m)); if (!items.length) return ''; return `<div class="grp">${g.g}</div>` + items.map(i => { const on = r.m === i.m; const cnt = COUNTS[i.m] ? COUNTS[i.m]() : 0; return `<a class="nav-item ${on?'on':''}" href="#/${i.m}/${i.pages[0][0]}"><span class="mg">${i.mg}</span>${esc(i.l)}${cnt?`<span class="cnt">${cnt}</span>`:''}</a>` + (on && i.pages.length > 1 ? `<div class="sub">${i.pages.map(([p,l]) => `<a class="${(r.p||i.pages[0][0])===p?'on':''}" href="#/${i.m}/${p}">${esc(l)}</a>`).join('')}</div>` : ''); }).join(''); }).join('');
}
function render() {
  const r = parseRoute(); S.route = r; const mod = modOf(r.m) || modOf('home'); const p = r.p || mod.pages[0][0]; r.p = p;
  if (S.role === 'guardian' && r.m !== 'portals') { location.hash = '#/portals/guardian'; return; }
  renderSidebar(r);
  const pg = PAGES[`${mod.m}/${p}`] || PAGES['home/index'];
  const pageLabel = (mod.pages.find(x => x[0] === p) || [p,p])[1];
  let html;
  try { html = pg.render(r); } catch (e) { html = `<div class="banner bad">This screen failed to render: ${esc(e.message)}</div>`; console.error(e); }
  $('#main').innerHTML = `<div class="crumbs"><a href="#/home">Home</a><span>›</span><a href="#/${mod.m}">${esc(mod.l)}</a><span>›</span><span>${esc(pageLabel)}</span></div><div class="page-hd"><div><h1>${esc(pg.title || pageLabel)}</h1>${pg.sub?`<p>${pg.sub}</p>`:''}</div><div class="actions">${pg.actions ? pg.actions(r) : ''}</div></div>${html}`;
  $('#main').scrollTop = 0;
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  if (pg.after) pg.after(r);
}
const PAGES = {};
const page = (key, def) => PAGES[key] = def;

      `<span>12:00 · PTM slot booking opens (Class 9–10)</span>${chip('scheduled')}`,

  return table('routine', { cols:[{k:'date',l:'Date',fmt:r=>dfmt(r.date)},{k:'time',l:'Time'},{k:'subject',l:'Paper'},{k:'full',l:'Full marks',r:true},{k:'rooms',l:'Rooms'},{k:'inv',l:'Invigilators'}], rows, search:false, noun:'papers' }) + `<div class="grid cols-3" style="margin-top:16px">${['R-1001','R-1002','R-1003'].map((r,i)=>card(`Room ${r} · 24 seats`, `<div class="beds">${Array.from({length:24},(_,k)=>`<div class="bed ${k%8===7?'vac':'occ'}" title="Seat ${k+1}">${k+1}<br><small>${k%2?'10B':'10A'}</small></div>`).join('')}</div>`)).join('')}</div>`;
} });
function marksKey() { return `${ui('mexam','EX3')}|${ui('msec', D.sections[33].id)}|${ui('msub','Mathematics')}`; }
page('exams/marks', { title:'Marks entry', sub:'Type marks; grade and grade point update instantly from the grading bands. Submit sends them for verification and locks after the deadline.', actions:() => btn('Import from Excel','form',{kind:'import'}) + btn('Submit for verification','marksSubmit',{}, 'primary'), render() {
  const secId = ui('msec', D.sections[33].id); const sec = D.sections.find(s=>s.id===secId); const subs = subjectsFor(sec.lvl); const sub = subs.includes(ui('msub')) ? ui('msub') : subs[0]; S.ui.msub = sub;
  const key = marksKey(); const ss = D.students.filter(x=>x.sec===secId); const m = S.marks[key] || (S.marks[key] = Object.fromEntries(ss.map(s => { const r = hrng(s.id+sub); const base = 30 + (s.gpa/5)*45 + r()*20; return [s.id, { th: Math.min(70, Math.round(base*0.7)), ca: Math.min(30, Math.round(base*0.3)), abs:false }]; })));
  const rows = ss.map(s => { const x = m[s.id]; const tot = x.abs ? 0 : x.th + x.ca; const g = gradeOf(tot); return `<tr><td class="mono muted">${pad(s.roll)}</td><td>${esc(s.name)}</td><td class="r"><input type="number" min="0" max="70" value="${x.th}" data-on="marks" data-key="${key}" data-sid="${s.id}" data-f="th" ${x.abs?'disabled':''}></td><td class="r"><input type="number" min="0" max="30" value="${x.ca}" data-on="marks" data-key="${key}" data-sid="${s.id}" data-f="ca" ${x.abs?'disabled':''}></td><td class="r num"><b>${tot}</b></td><td>${x.abs?chip('absent'):`<span class="chip ${g[0]==='F'?'bad':g[0]==='A+'?'ok':'info'}">${g[0]}</span>`}</td><td class="r num">${x.abs?'—':g[2].toFixed(2)}</td><td>${cb(x.abs,'marksAbs',{key,sid:s.id})}</td></tr>`; }).join('');
  const arr = ss.map(s => m[s.id].abs?0:m[s.id].th+m[s.id].ca); const avg = arr.reduce((a,b)=>a+b,0)/arr.length; const fails = arr.filter(v=>v<33).length;
  return `<div class="card pad0 marks"><div class="tbl-tools"><select data-on="ui" data-key="mexam">${D.exams.map(e=>`<option value="${e.id}" ${e.id===ui('mexam','EX3')?'selected':''}>${esc(e.name)}</option>`).join('')}</select>${secSelect('msec', s=>s.lvl>=6)}<select data-on="ui" data-key="msub">${subs.map(s=>`<option ${s===sub?'selected':''}>${esc(s)}</option>`).join('')}</select><span style="margin-left:auto" class="small muted">Theory 70 · CA 30 · pass 33 · avg <b>${avg.toFixed(1)}</b> · fails <b class="${fails?'down':''}">${fails}</b> · deadline 30 Sep 17:00</span></div>
  <div class="tbl-wrap"><table><thead><tr><th>Roll</th><th>Student</th><th class="r">Theory /70</th><th class="r">CA /30</th><th class="r">Total</th><th>Grade</th><th class="r">GP</th><th>Absent</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
} });
function resultsFor(secId) { const sec = D.sections.find(s=>s.id===secId); const subs = subjectsFor(sec.lvl); const ss = D.students.filter(x=>x.sec===secId); const rows = ss.map(s => { const per = subs.map(sub => { const r = hrng(s.id+sub+'EX2'); const tot = Math.min(100, Math.round(28 + (s.gpa/5)*50 + r()*22)); return { sub, tot, g: gradeOf(tot) }; }); const fails = per.filter(p=>p.g[0]==='F').length; const gpa = fails ? 0 : per.reduce((a,p)=>a+p.g[2],0)/per.length; const total = per.reduce((a,p)=>a+p.tot,0); return { id:s.id, roll:s.roll, name:s.name, per, total, pctv: total/(subs.length*100)*100, gpa: Math.round(gpa*100)/100, fails, pass: !fails, att: s.attRate }; }); rows.sort((a,b)=>b.gpa-a.gpa||b.total-a.total).forEach((r,i)=>r.rank=i+1); return { sec, subs, rows }; }
page('exams/results', { title:'Results', sub:'Computed by the result engine when all papers lock: credit-weighted GPA, pass/fail, rank in section and class. Click a student for the report card.', actions:() => doBtn('Publish & notify guardians','Results published','D6 · Half-Yearly results published for selected section; report card PDFs rendered; guardians notified with GPA and rank','rule','primary') + doBtn('Tabulation sheet','Download queued','Tabulation sheet (PDF) queued for selected section','cron'), render(r) {
  const secId = ui('rsec', D.sections[24].id); const { sec, subs, rows } = resultsFor(secId); const dist = BANDS.map(b => ({ l:b[0], v: rows.filter(x => (x.gpa>=b[2] && (b[0]==='A+' ? true : x.gpa < BANDS[BANDS.indexOf(b)-1][2])) && (b[0]!=='F' || x.fails)).length }));
  return `<div class="grid cols-3" style="margin-bottom:16px">${kpi('Pass rate', pct(rows.filter(x=>x.pass).length/rows.length*100), `${rows.filter(x=>!x.pass).length} failed in ≥1 subject`, '#/exams/results')}${kpi('Section average GPA', (rows.reduce((a,b)=>a+b.gpa,0)/rows.length).toFixed(2), `top: ${esc(rows[0].name)} · ${rows[0].gpa.toFixed(2)}`, '#/exams/results')}<div class="card"><div class="hd"><h3>Grade distribution</h3></div>${bars(dist, {h:110, label:'Grade distribution'})}</div></div>
  ${table('results', { cols:[{k:'rank',l:'Rank',r:true},{k:'roll',l:'Roll',r:true},{k:'name',l:'Student'},{k:'total',l:'Total',r:true,fmt:r=>`${r.total} <span class="muted">/ ${subs.length*100}</span>`},{k:'pctv',l:'%',r:true,fmt:r=>pct(r.pctv)},{k:'gpa',l:'GPA',r:true,fmt:r=>`<b>${r.gpa.toFixed(2)}</b>`},{k:'fails',l:'Failed subjects',r:true,fmt:r=>r.fails?`<span class="down">${r.fails}</span>`:'0'},{k:'att',l:'Attendance',r:true,fmt:r=>pct(r.att)},{k:'pass',l:'Result',fmt:r=>chip(r.pass?'published':'failed', r.pass?'pass':'fail')}], rows, tools:`<select data-on="ui" data-key="rexam"><option>Half-Yearly Examination 2026</option><option>1st Term Examination 2026</option></select>${secSelect('rsec')}`, pageSize:45, onRow:{act:'drawer',a:{kind:'reportcard',sec:secId}}, noun:'students' })}`;
} });

page('fees/overview', { title:'Fees overview', sub:'Invoices are generated on the 1st, reminders escalate at −3, 0, +7, +15, +30 days, fines apply once, every payment posts to the ledger.', actions:() => doBtn('Generate invoices (next month)','Batch scheduled','F1 · October invoice batch scheduled for 1 Oct 06:00 · 1,229 active students','cron','primary'), render() {

  <div class="grid cols-2"><div class="card"><div class="hd"><h3>Collection by method · September</h3></div>${bars(byMethod, {fmt:v=>(v/100000).toFixed(1)+'L', label:'Collection by method'})}</div><div class="card"><div class="hd"><h3>Receivables ageing</h3></div>${listHtml(aging.map(([l,v])=>`<span>${l}</span><span style="display:flex;gap:10px;align-items:center;min-width:220px">${bar(v/fs.out*100, l==='60+ days'?'bad':l==='Not due'?'':'warn')}<b class="num">${money(v)}</b></span>`))}</div>

page('transport/live', { title:'Live map', sub:'GPS packets every 10 seconds. Entering a stop geofence pushes "bus approaching" to that stop’s guardians; RFID taps confirm boarding.', actions:() => doBtn('Simulate geofence event','Guardians notified','J2 · Bus Route 2 (Uttara) entered geofence Uttara 10 → 11 guardians pushed','sys'), render() {
  const paths = [[40,40,180,90,300,60,420,120],[560,40,470,110,420,180,420,120],[60,260,180,220,300,200,420,140],[560,260,500,210,450,170,420,140],[40,150,140,150,280,130,420,130],[560,150,520,150,470,140,420,130]];
  const svg = `<svg viewBox="0 0 600 300" role="img" aria-label="Six bus routes converging on the school with live bus positions">${paths.map((p,i)=>`<path d="M${p[0]},${p[1]} C${p[2]},${p[3]} ${p[4]},${p[5]} ${p[6]},${p[7]}" fill="none" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/><path d="M${p[0]},${p[1]} C${p[2]},${p[3]} ${p[4]},${p[5]} ${p[6]},${p[7]}" id="rp${i}" fill="none" stroke="${D.routes[i].status==='delayed'?'var(--warn)':D.routes[i].status==='completed'?'var(--muted)':'var(--accent)'}" stroke-width="2" stroke-dasharray="4 4"/><text x="${p[0]}" y="${p[1]-10}" style="fill:var(--muted);font-size:10px;font-family:var(--mono)">${esc(D.routes[i].area)}</text>`).join('')}<rect x="405" y="115" width="30" height="30" rx="4" style="fill:var(--ink)"/><text x="420" y="160" text-anchor="middle" style="fill:var(--ink);font-size:10px;font-weight:600">School</text>${D.routes.map((r,i)=>`<g id="bus${i}"><circle r="8" style="fill:${r.status==='delayed'?'var(--warn)':r.status==='completed'?'var(--muted)':'var(--ok)'};stroke:var(--surface);stroke-width:2"/><text y="3" text-anchor="middle" style="fill:#fff;font-size:8px;font-weight:700">${i+1}</text></g>`).join('')}</svg>`;
  return `<div class="grid" style="grid-template-columns:1fr 340px"><div class="card map">${svg}</div><div class="card"><div class="hd"><h3>Trips · pickup</h3></div>${listHtml(D.routes.map((r,i)=>`<span><b>${esc(r.name)}</b><br><span class="muted small">${esc(r.vehicle)} · ${r.students} students · ${r.driver}</span></span><span>${chip(r.status)}<br><span class="small muted num" id="prog${i}">${Math.round(r.progress*100)}%</span></span>`))}</div></div>`;
}, after() {
  const paths = Array.from({length:6},(_,i)=>$('#rp'+i)); const place = () => paths.forEach((p,i) => { if (!p) return; const r = D.routes[i]; if (r.status==='running') { r.progress = Math.min(1, r.progress + 0.004); if (r.progress >= 1) r.status = 'completed'; } const pt = p.getPointAtLength(p.getTotalLength()*Math.min(1,r.progress)); const g = $('#bus'+i); if (g) g.setAttribute('transform',`translate(${pt.x},${pt.y})`); const pr = $('#prog'+i); if (pr) pr.textContent = Math.round(r.progress*100)+'%'; }); place(); S.timer = setInterval(place, 250);
} });

  rule: { t:'New automation rule', f:[{k:'name',l:'Name'},{k:'trig',l:'When (event)',type:'select',opts:['attendance.absent','attendance.late','invoice.overdue','payment.received','result.published','incident.reported','book.overdue','bus.approaching_stop']},{k:'cond',l:'If (JSONLogic)',v:'{"var":"guardian.receives_notifications"}'},{k:'act',l:'Then',type:'select',opts:['notify guardians (push, sms)','create task for class teacher','add invoice item','start approval','call webhook']}], s:'Create (preview 48h)', on(v){ D.rules.push({ code:'X'+(D.rules.length+1), mod:'Custom', kind:'rule', trig:v.trig, act:v.act, on:true, runs:0, last:TODAY }); pushFeed('sys','rule.created · '+(v.name||'custom rule')+' · preview mode for 48h'); return 'Rule created in preview mode'; } },
  generic: { t:'New record', f:[{k:'name',l:'Name'},{k:'note',l:'Notes',type:'textarea'}], s:'Save', on(){ return 'Saved'; } },
};
['year','section','subject','calevent','device','exam','question','onlineexam','assignment','material','onlineclass','feestructure','discount','account','journal','expense','match','component','book','issue','route','vehicle','maintenance','allocate','outpass','menu','item','movement','po','issuereq','template','provider','event','brule','health','clinic','docreq','doctpl','visitor','complaint','call','postal','webhook','campus','user','upload','import'].forEach(k => { if (!FORMS[k]) FORMS[k] = { t: 'New ' + k.replace(/([a-z])([A-Z])/g,'$1 $2'), f:[{k:'name',l:'Name / title'},{k:'date',l:'Date',type:'date',v:dstr(TODAY),half:true},{k:'amount',l:'Amount / quantity',type:'number',half:true},{k:'note',l:'Notes',type:'textarea'}], s:'Save', on(v){ pushFeed('sys', k + '.created · ' + (v.name||'record')); return 'Saved'; } }; });

/* ================= ACTIONS ================= */
const ACT = {
  nav: a => { location.hash = a.to; },
  sort: a => { const st = S.ui['t:'+a.t]; st.dir = st.sort === a.c ? -st.dir : 1; st.sort = a.c; rerenderTable(a.t); },
  page: a => { const st = S.ui['t:'+a.t]; const pages = Math.ceil((S.tbl[a.t].rows.length)/(S.tbl[a.t].pageSize||15)); st.page = Math.max(1, Math.min(pages, a.n)); rerenderTable(a.t); },
  filter: a => { const st = S.ui['t:'+a.t]; st.f = a.f; st.page = 1; rerenderTable(a.t); },
  tab: a => { S.ui[a.k] = a.v; if (a.k === 'sdtab' && S.drawerOpen) { const cur = S.lastDrawer; if (cur) DR[cur.kind](cur); } else render(); },
  drawer: a => { S.lastDrawer = a; if (DR[a.kind]) DR[a.kind](a); },
  closeDrawer: () => closeDrawer(),
  closeModal: () => closeModal(),
  form: a => { const f = FORMS[a.kind] || FORMS.generic; formModal(f.t, f.f, f.s, f.on); },
  submit: () => { if (!S.onSubmit) return; const v = formValues(); const msg = S.onSubmit(v); closeModal(); toast(msg || 'Saved'); render(); },
  do: a => { if (a.f && a.f !== '—') pushFeed(a.k || 'rule', a.f); toast(a.t, a.f && a.f !== '—' ? a.f : undefined); if (a.f && a.f !== '—') render(); },
  approve: a => { const ap = D.approvals.find(x=>x.id===a.id); if (ap) { ap.status = a.dec; const eff = a.dec==='approved' ? (ap.type==='Leave' ? 'C9 · days marked excused, balance deducted; B3 · substitutes suggested' : ap.type==='Expense' ? 'expense.approved → payment task created' : ap.type==='Discount' ? 'discount.approved → open invoice re-rated, guardian notified' : ap.type==='Refund' ? 'F8 · gateway refund requested, journal reversal drafted' : 'PO emailed to vendor') : 'requester notified with reason'; pushFeed('sys', `${ap.id} ${a.dec} · ${eff}`); toast(`${ap.type} ${a.dec}`, eff); } closeDrawer(); render(); },
  appStatus: a => { const ap = D.applications.find(x=>x.id===a.id); if (!ap) return; ap.status = a.st; const m = { shortlisted:'A5 · shortlisted; SMS to guardian', offered:'A6 · offer issued, admission-fee invoice ৳15,000 & offer letter sent, expires in 7 days', enrolled:'A8 · enrolled: student record, guardian OTP account, section allocated, ID & library cards queued, welcome SMS' }; pushFeed('sys', ap.name+' → '+m[a.st]); toast(ap.name+' → '+a.st, m[a.st]); closeDrawer(); render(); },
  task: a => { const t = D.tasks.find(x=>x.id===a.id); if (t) { t.done = !t.done; render(); } },
  ruleToggle: a => { const r = D.rules.find(x=>x.code===a.code); if (r) { r.on = !r.on; pushFeed('sys', `rule ${r.code} ${r.on?'enabled':'disabled'} by Principal${r.on?' · preview mode 48h':''}`); toast(`Rule ${r.code} ${r.on?'enabled':'disabled'}`); } closeDrawer(); render(); },
  tplToggle: a => { const t = D.templates.find(x=>x.key===a.key && x.ch===a.ch && x.locale===a.locale); if (t) t.active = !t.active; render(); },
  provToggle: a => { const p = D.providers.find(x=>x.provider===a.provider); if (p) p.active = !p.active; render(); },
  att: a => { S.att[a.sec][a.sid] = a.v; render(); },
  attAll: a => { Object.keys(S.att[a.sec]).forEach(k => S.att[a.sec][k] = 'P'); render(); },
  attSave: a => { const st = S.att[a.sec]; const abs = Object.values(st).filter(v=>v==='A').length, late = Object.values(st).filter(v=>v==='L').length; D.students.filter(s=>s.sec===a.sec).forEach(s => s.today = st[s.id]==='P'?'present':st[s.id]==='L'?'late':'absent'); pushFeed('sys', `attendance.marked · ${secLabel(D.sections.find(s=>s.id===a.sec))} saved: ${abs} absent → ${abs} SMS queued (C4), ${late} late → ${late} push (C2)`); toast('Attendance saved', `${abs} absent SMS and ${late} late notifications queued`); render(); },
  marksAbs: a => { const m = S.marks[a.key][a.sid]; m.abs = !m.abs; render(); },
  marksSubmit: () => { pushFeed('sys', 'marks.submitted · '+marksKey().replace(/\|/g,' · ')+' → validated (range, missing), grades computed; verification task to HOD'); toast('Marks submitted for verification', 'Grades computed; HOD notified'); render(); },
  pay: a => { const i = invoice(a.id); if (!i) return; const bal = a.all ? D.invoices.filter(x=>x.sid===i.sid && x.status!=='paid').reduce((s,x)=>s+x.total-x.paid,0) : i.total - i.paid; S.payFor = a; openModal('Record payment', `${kv([['Invoice',`<span class="mono">${a.all?'all open invoices':i.id}</span>`],['Student',i.student],['Balance',`<b>${money(bal)}</b>`]])}<form id="mform" onsubmit="return false"><div class="frow">${field({k:'amount',l:'Amount (৳)',type:'number',v:bal})}${field({k:'method',l:'Method',type:'select',opts:['bkash','nagad','cash','sslcommerz','card','bank_transfer']})}</div>${field({k:'ref',l:'Transaction id / reference',ph:'e.g. BKA8H2K9X'})}</form>`, btn('Cancel','closeModal') + btn('Confirm payment','payConfirm',{},'primary')); },
  payConfirm: () => { const v = formValues(); const a = S.payFor; let amt = Number(v.amount)||0; const first = invoice(a.id); const targets = a.all ? D.invoices.filter(x=>x.sid===first.sid && x.status!=='paid').sort((x,y)=>x.due.localeCompare(y.due)) : [first]; let left = amt; const p = { id:'RCPT-'+pad(paySeq++,5), inv: targets.map(t=>t.id).join(', '), sid:first.sid, student:first.student, amt, method:v.method, at:dstr(TODAY), ref:v.ref||'', by: v.method==='cash'?'Counter · Sumon':'Online' }; D.payments.unshift(p); for (const t of targets) { if (left <= 0) break; const take = Math.min(left, t.total - t.paid); t.paid += take; left -= take; t.status = t.paid >= t.total ? 'paid' : 'partially_paid'; } closeModal(); closeDrawer(); pushFeed('sys', `F5 · payment.received ${p.id} ${money(amt)} via ${v.method} → allocated oldest-first to ${targets.length} invoice(s), ledger entry, receipt PDF, journal JE-${1200+paySeq} posted`); pushFeed('rule', `payment thanks · SMS + push to guardian of ${first.student}`); if (targets.every(t=>t.status==='paid')) pushFeed('rule', `F6 · no overdue left for ${first.student} → admit-card block lifted`); toast(`Payment ${money(amt)} recorded`, 'Receipt, SMS and journal entry created automatically'); render(); },
  returnBook: a => { const i = D.issues.find(x=>x.id===a.id); if (i) { const fine = i.fine; i.status = 'returned'; pushFeed('sys', `book.returned · ${i.book} by ${i.member}${fine?` · fine ${money(fine)} added to next invoice`:''}; I4 · next reservation checked`); toast('Returned', fine ? `Fine ${money(fine)} pushed to the student’s next invoice` : 'No fine'); } render(); },
  runJob: a => { const j = D.jobs.find(x=>x.key===a.key); if (j) { j.last = new Date(TODAY.getTime()+ (Date.now()%3600000)); j.status = 'success'; pushFeed('cron', `${j.key} · run manually by Principal · ${rint(3,900)} rows processed`); toast('Job ran', j.key); } render(); },
  chat: a => { S.chat = a.id; const c = D.conversations.find(x=>x.id===a.id); if (c) c.unread = 0; render(); },
  chatSend: a => { const inp = $('#chatinput'); const c = D.conversations.find(x=>x.id===a.id); if (inp && inp.value.trim() && c) { c.msgs.push({ t: inp.value.trim(), me:true, at: tfmt(new Date()) }); render(); const box = $('#msgs'); if (box) box.scrollTop = box.scrollHeight; } },
  phone: a => { S.phone.tab = a.v; render(); },
  perm: a => { const cyc = ['none','view','edit']; D.perms[a.r][a.m] = cyc[(cyc.indexOf(D.perms[a.r][a.m])+1)%3]; render(); },
  cal: a => { S.calMonth = Math.max(0, Math.min(11, S.calMonth + a.d)); render(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) { if (!e.target.closest('#bellpop,#bellbtn')) $('#bellpop').hidden = true; if (!e.target.closest('.search')) $('#gresults').hidden = true; return; }
  if (el.tagName === 'A' && el.getAttribute('href')?.startsWith('#')) return;
  let a = {}; try { a = JSON.parse(el.dataset.a || '{}'); } catch {} const fn = ACT[el.dataset.act]; if (fn) fn(a);
});
document.addEventListener('input', e => { const el = e.target; if (el.dataset.on === 'search') { S.ui['t:'+el.dataset.t].q = el.value; S.ui['t:'+el.dataset.t].page = 1; rerenderTable(el.dataset.t); } if (el.id === 'gsearch') globalSearch(el.value); });
document.addEventListener('change', e => { const el = e.target; if (el.dataset.on === 'ui') { S.ui[el.dataset.key] = el.value; render(); } else if (el.dataset.on === 'marks') { const m = S.marks[el.dataset.key][el.dataset.sid]; m[el.dataset.f] = Math.max(0, Math.min(el.dataset.f==='th'?70:30, Number(el.value)||0)); render(); } else if (el.dataset.on === 'hstud') { const s = D.students.find(x=>x.name===el.value); if (s) { S.ui.hstud = s.id; render(); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeDrawer(); $('#gresults').hidden = true; } if (e.key === '/' && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) { e.preventDefault(); $('#gsearch').focus(); } });
$('#overlay').addEventListener('click', () => { closeModal(); closeDrawer(); });
window.addEventListener('hashchange', () => { closeDrawer(); closeModal(); render(); });

function globalSearch(q) { const box = $('#gresults'); q = q.trim().toLowerCase(); if (q.length < 2) { box.hidden = true; return; } const res = [];
  D.students.filter(s => s.name.toLowerCase().includes(q) || s.adm.includes(q) || s.gphone.includes(q) || s.guardian.toLowerCase().includes(q)).slice(0,6).forEach(s => res.push([`${s.name} <span class="muted small">· ${s.cls} ${s.section} · ${s.adm}</span>`, 'Student', {kind:'student',id:s.id}]));
  D.staff.filter(s => s.name.toLowerCase().includes(q) || s.emp.toLowerCase().includes(q)).slice(0,4).forEach(s => res.push([`${s.name} <span class="muted small">· ${s.desig}</span>`, 'Staff', {kind:'staff',id:s.id}]));
  D.invoices.filter(i => i.id.toLowerCase().includes(q)).slice(0,4).forEach(i => res.push([`${i.id} <span class="muted small">· ${i.student} · ${money(i.total-i.paid)} due</span>`, 'Invoice', {kind:'invoice',id:i.id}]));
  D.books.filter(b => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)).slice(0,3).forEach(b => res.push([`${b.title} <span class="muted small">· ${b.author}</span>`, 'Book', {kind:'book',id:b.id}]));
  box.innerHTML = res.length ? res.map(([l,t,a]) => `<div ${A('drawer')} data-a='${J(a)}'><span>${l}</span><span class="tag">${t}</span></div>`).join('') : '<div class="muted">No matches</div>'; box.hidden = false; }

$('#bellbtn').addEventListener('click', () => { const p = $('#bellpop'); p.innerHTML = `<div class="hd">Notifications <span class="small muted">${D.notifications.length} new</span></div>${D.notifications.map(n => `<div class="it" ${A('nav')} data-a='${J({to:n.to})}'><span><span class="tag">${n.k}</span> ${esc(n.t)}</span><span class="muted small">${tfmt(n.at)}</span></div>`).join('')}`; p.hidden = !p.hidden; });
$('#themebtn').addEventListener('click', () => { const root = document.documentElement; const dark = root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); root.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('ps-theme', root.dataset.theme); } catch {} });
$('#rolesel').addEventListener('change', e => { S.role = e.target.value; if (S.role === 'guardian') location.hash = '#/portals/guardian'; else if (ROLE_NAV[S.role] && !ROLE_NAV[S.role].includes(parseRoute().m)) location.hash = '#/home'; else render(); toast('Viewing as ' + e.target.options[e.target.selectedIndex].text); });
$('#yearsel').addEventListener('change', e => toast('Academic year ' + e.target.value, 'Demo data is for 2026 only'));

try { const t = localStorage.getItem('ps-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
if (!location.hash) location.hash = '#/home';
render();
setInterval(() => { if (Math.random() < .5) { const s = D.students[Math.floor(Math.random()*D.students.length)]; pushFeed(['sys','rule','cron'][Math.floor(Math.random()*3)], pick([`J3 · RFID boarding · ${s.name} boarded Route ${rint(1,6)}`,`F5 · payment.received ৳${TUITION[s.lvl]} via bKash for ${s.name}`,`C2 · late arrival SMS · ${s.name}`,`M1 · notification delivered · push · ${s.guardian}`,`E2 · assignment reminder · ${s.cls} ${s.section}`])); if (S.route && S.route.m === 'automation' && S.route.p === 'activity' && !S.drawerOpen && !$('#modal').classList.contains('show')) render(); } }, 9000);
</script>
